services:
  # PHP Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rasagroup/app
    container_name: ${APP_CONTAINER_NAME:-${DOCKER_CONTAINER_PREFIX:-rasagroup}-app}
    restart: unless-stopped
    tty: true
    env_file:
      - .env
    environment:
      SERVICE_NAME: ${APP_SERVICE_NAME:-app}
      SERVICE_TAGS: ${APP_SERVICE_TAGS:-dev}
    working_dir: /var/www
    depends_on:
      - redis
    networks:
      - rasagroup-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Nginx Service
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: rasagroup/web
    container_name: ${WEB_CONTAINER_NAME:-${DOCKER_CONTAINER_PREFIX:-rasagroup}-web}
    restart: unless-stopped
    tty: true
    # Host 80/443 dipakai domain lain: map ke port bebas (mis. 18080) lalu terminate TLS di nginx host.
    ports:
      - "${WEB_HTTP_PORT:-18080}:80"
    depends_on:
      - app
    networks:
      - rasagroup-network

  # Redis Service
  redis:
    image: redis:alpine
    container_name: ${REDIS_CONTAINER_NAME:-${DOCKER_CONTAINER_PREFIX:-rasagroup}-redis}
    restart: unless-stopped
    tty: true
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - rasagroup-network

# Networks
networks:
  rasagroup-network:
    driver: bridge

# Volumes
volumes:
  redisdata:
